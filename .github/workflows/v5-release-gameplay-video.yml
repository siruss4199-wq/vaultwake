name: Vaultwake real gameplay capture (draft preview)
on:
  push:
    branches: [codex/v5-order-economy-recipe-fix]

permissions:
  contents: read

jobs:
  capture:
    name: Capture real on-screen rare Gold gameplay
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test browser and ffmpeg
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium webkit
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Record real gameplay (not animation / not a mockup)
        env:
          VAULTWAKE_RECORD_DIR: video-capture/raw
          SHOTS: video-capture/screenshots
        run: |
          mkdir -p video-capture/raw video-capture/screenshots
          python3 -m http.server 8080 > /tmp/vaultwake-video-server.log 2>&1 &
          sleep 1
          node tests/v5-next-ch1-rare-browser.cjs
          test -n "$(find video-capture/raw -type f -name '*.webm' -print -quit)"
      - name: Make silent 15-second review excerpt from actual browser recording
        run: |
          set -euo pipefail
          VIDEO="$(find video-capture/raw -type f -name '*.webm' | head -1)"
          echo "Captured: $VIDEO"
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$VIDEO")"
          # Choose a segment near the later rare merge / Gold delivery, not early home loading.
          START="$(awk -v d="$DURATION" 'BEGIN{printf "%.2f", (d>20?d-18:0)}')"
          ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$VIDEO" -t 15 -an             -vf "scale=800:1731:flags=lanczos,crop=800:1200:0:240,fps=30,format=yuv420p"             -movflags +faststart -c:v libx264 -preset veryfast -crf 19             video-capture/vaultwake-actual-gameplay-portrait-DRAFT.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 video-capture/vaultwake-actual-gameplay-portrait-DRAFT.mp4
      - name: Upload raw footage, screenshots and draft video for human editorial approval
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vaultwake-real-gameplay-draft-${{ github.sha }}
          path: video-capture/
          retention-days: 30
