# Scratch diagnostic (not for merge): verify the Cloudflare Pages QA preview of PR #106 (bd68669) from a runner,
# since the preview host is not reachable from the development container. 1) the deployed files are byte-identical
# to the commit; 2) the game starts on an emulated iPhone (WebKit) and in Chromium; 3) the Shed overlay and Board
# Full Rescue browser tests pass against the preview itself (fresh browser contexts: nothing touches a real device).
name: V5 QA preview check (diagnostic)
on:
  push:
    branches: [claude/v5-shed-repro]
permissions:
  contents: write
env:
  PREVIEW: https://ae6fe693.wispwood-game.pages.dev
  SHA: bd6866998dc9fe0c2e595be1a4ae1084230ed656
jobs:
  files:
    name: deployed files = commit bd68669
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git fetch -q origin "$SHA" || git fetch -q origin claude/v5-board-full-rescue
          bad=0;n=0
          for f in $(git ls-tree -r --name-only "$SHA" v5/play.html v5/coast-crazygames.html v5/next v5/style.css v5/mobile.css v4/platform.mjs | grep -E '\.(html|mjs|js|css)$'); do
            n=$((n+1)); want=$(git show "$SHA:$f" | sha256sum | cut -c1-64); got=$(curl -sfL "$PREVIEW/$f" | sha256sum | cut -c1-64)
            if [ "$want" != "$got" ]; then echo "DIFF $f"; bad=$((bad+1)); fi
          done
          echo "checked $n files, $bad differ"; [ "$bad" = 0 ]
          curl -sIL "$PREVIEW/v5/play.html" | grep -iE '^(HTTP|content-type|x-robots-tag|cache-control)' | head -8
  play:
    name: preview play ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, chromium]
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: npm install --no-save --no-audit --no-fund playwright@1.62.1
      - name: The PR's own tests, from the commit
        run: |
          git config --global --add safe.directory "$PWD"
          git fetch -q origin claude/v5-board-full-rescue
          git checkout -q "$SHA" -- tests/v5-next-board-rescue-browser.cjs tests/v5-next-shed-overlay-browser.cjs tests/fixtures/coast
      - name: Smoke on an emulated iPhone 13 (webkit job) / Chromium
        if: matrix.engine == 'webkit'
        run: mkdir -p evidence-preview && ORIGIN=$PREVIEW OUT=evidence-preview node .github/scratch/preview-smoke.cjs
      - name: Shed overlay test against the preview
        run: ORIGIN=$PREVIEW ENGINES=${{ matrix.engine }} VIEWPORTS=390x664 node tests/v5-next-shed-overlay-browser.cjs
      - name: Board Full Rescue test against the preview
        run: ORIGIN=$PREVIEW ENGINES=${{ matrix.engine }} node tests/v5-next-board-rescue-browser.cjs
      - name: Commit the iPhone screenshots to this scratch branch
        if: matrix.engine == 'webkit'
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset -q; git add evidence-preview && git commit -q -m "chore(claude): QA preview iPhone screenshots (diagnostic) [skip ci]" && for i in 1 2 3; do git pull -q --rebase origin claude/v5-shed-repro && git push -q origin HEAD:claude/v5-shed-repro && break; sleep 3; done
