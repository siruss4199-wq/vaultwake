# WebKit page loss on release/playgama (2026-11-25). The source-suite job of v5-playgama.yml lost its WebKit page in the
# build-flow suite (runs 45435802641, 45552321250). Run 45555518192 ran build flow ALONE: the base ac1d8bc passed 3/3,
# this branch's head failed 3/3 (the Playgama ZIP's own WebKit tests pass, music included). This round finds the
# cause: build flow alone, twice each, on
#   b95d967       the Playgama integration before the audio and icon commits,
#   head          this branch,
#   head-nomusic  this branch with the background-music element switched off (a one-line edit in the job only),
# printing the test's own output and errors and the WebKit process log. Diagnostic only.
name: V5 Playgama WebKit isolation (build flow)
on:
  push:
    branches: [release/playgama]
    paths: ['.github/workflows/v5-playgama-webkit-isolation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolate:
    name: build flow · ${{ matrix.code }} · try ${{ matrix.attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        code: [b95d967, head, head-nomusic]
        attempt: [1, 2]
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      HOME: /root
      ENGINES: webkit
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.code == 'b95d967' && 'b95d967' || github.sha }}
          fetch-depth: 0
      - run: npm install --no-save --no-audit --no-fund playwright@1.62.1
      - name: Music off (head-nomusic only)
        if: matrix.code == 'head-nomusic'
        run: |
          grep -c "const el=new Audio();" v5/next/sfx.mjs
          sed -i 's/const el=new Audio();/if(globalThis)return null;const el=new Audio();/' v5/next/sfx.mjs
          grep -n "return null;const el=new Audio" v5/next/sfx.mjs
      - name: Static server
        run: |
          (node tools/ci-static-server.mjs . 8080 > /tmp/http.log 2>&1 &)
          for i in $(seq 1 30); do node -e "fetch('http://127.0.0.1:8080/v5/play.html').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))" && break; sleep 1; done
      - name: Build flow alone (WebKit)
        run: |
          git config --global --add safe.directory "$PWD" || true
          echo "code ${{ matrix.code }}: $(git log --oneline -1 || true)"
          s=$(date +%s)
          set +e
          DEBUG=pw:browser node tests/v5-next-build-flow-browser.cjs > /tmp/out.txt 2> /tmp/err.txt; rc=$?
          echo "exit $rc after $(( $(date +%s)-s )) s"
          echo "--- test output"; cat /tmp/out.txt
          echo "--- errors (without the browser-process log)"; grep -v "pw:browser" /tmp/err.txt | tail -30
          echo "--- WebKit process log: crash / signal / exit lines"; grep -iE "crash|signal|sigsegv|sigabrt|sigkill|killed|oom|terminated|exited|closed|gst|gstreamer|media" /tmp/err.txt | tail -30
          echo "--- last browser log lines"; grep "pw:browser" /tmp/err.txt | tail -15
          echo "RESULT ${{ matrix.code }} try${{ matrix.attempt }} rc=$rc"
          exit $rc
