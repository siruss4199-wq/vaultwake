name: V5 PR93 browser QA
on:
  push:
    branches: [codex/v5-order-economy-recipe-fix, codex/v5-release-qa, fix/v5-vault-door-cliff-blend]
  pull_request:
    branches: [codex/v5-order-economy-recipe-fix]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coast-mobile:
    name: Coast mobile regression (Chromium & WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and iPhone WebKit
        run: npm install --no-save playwright@1.62.1 && npx playwright install --with-deps chromium webkit
      - name: Start local test server
        run: |
          python3 -m http.server 8080 > /tmp/coast-http.log 2>&1 &
          sleep 1
      - name: Chapter journey labels and mobile scrolling
        run: node tests/v5-next-journey-browser.cjs
      - name: Chapter 1 Vault landmark and late chapter centering
        if: ${{ !cancelled() }}
        run: node tests/v5-next-landmark-browser.cjs
      - name: Opening guide, mobile layouts, first merges
        run: node tests/v5-next-guide-browser.cjs
      - name: Chapter 1 rare Gold and restoration
        if: ${{ !cancelled() }}
        run: node tests/v5-next-ch1-rare-browser.cjs
      - name: Rare order instructions and visible board interactions
        if: ${{ !cancelled() }}
        run: node tests/v5-next-rare-merges-browser.cjs
      - name: Save preservation and reload
        if: ${{ !cancelled() }}
        run: node tests/v5-next-saves-browser.cjs
      - name: CrazyGames browser integration
        if: ${{ !cancelled() }}
        run: node tests/v5-next-crazygames-browser.cjs
