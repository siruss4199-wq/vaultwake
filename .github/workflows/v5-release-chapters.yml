name: Vaultwake release chapter QA
on:
  push:
    branches: [codex/v5-order-economy-recipe-fix, codex/v5-release-qa, codex/v5-first-session-energy-balance, codex/v5-mobile-first-session-final-qa]
  pull_request:
    branches: [codex/v5-order-economy-recipe-fix, claude/v5-vault-art-integration, codex/v5-first-session-energy-balance]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chapters:
    name: Chapter ${{ matrix.chapter }} browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        chapter: [2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: npm install --no-save playwright@1.62.1 && npx playwright install --with-deps chromium
      - name: Run Chapter browser journey at phone/tablet viewports
        env:
          ENGINES: chromium
        run: |
          python3 -m http.server 8080 > /tmp/vaultwake-http.log 2>&1 &
          sleep 1
          node tests/v5-next-chapter${{ matrix.chapter }}-browser.cjs

  other-mobile:
    name: Wider Coast mobile browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and WebKit
        run: npm install --no-save playwright@1.62.1 && npx playwright install --with-deps chromium webkit
      - name: Run core mobile journeys
        run: |
          python3 -m http.server 8080 > /tmp/vaultwake-http.log 2>&1 &
          sleep 1
          node tools/run-browser-qa.mjs tests/v5-next-browser.cjs
          node tools/run-browser-qa.mjs tests/v5-next-bright-browser.cjs
          node tools/run-browser-qa.mjs tests/v5-next-energy-browser.cjs
          node tools/run-browser-qa.mjs tests/v5-next-extras-browser.cjs
          node tools/run-browser-qa.mjs tests/v5-next-home-browser.cjs
          node tools/run-browser-qa.mjs tests/v5-next-story-browser.cjs
          node tools/run-browser-qa.mjs tests/v5-next-rewards-browser.cjs
          node tools/run-browser-qa.mjs tests/v5-next-playtest-browser.cjs

  classic-compatibility:
    name: Classic legacy browser QA (Chromium and WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and WebKit
        run: npm install --no-save playwright@1.62.1 && npx playwright install --with-deps chromium webkit
      - name: Start Classic test server
        run: |
          python3 -m http.server 8080 > /tmp/classic-http.log 2>&1 &
          sleep 1
      - name: Wide-font high-energy phone header regression
        run: node tools/run-browser-qa.mjs tests/v5-legacy-layout-browser.cjs
      - name: Run unchanged Classic camp assertions
        if: ${{ !cancelled() }}
        run: node tools/run-browser-qa.mjs tests/v5-camp-browser.cjs
      - name: Run unchanged Classic coastal Chromium assertions
        if: ${{ !cancelled() }}
        env:
          COASTAL_ENGINE: chromium
        run: node tools/run-browser-qa.mjs tests/v5-coastal-browser.cjs
      - name: Run unchanged Classic coastal WebKit assertions
        if: ${{ !cancelled() }}
        env:
          COASTAL_ENGINE: webkit
        run: node tools/run-browser-qa.mjs tests/v5-coastal-browser.cjs
